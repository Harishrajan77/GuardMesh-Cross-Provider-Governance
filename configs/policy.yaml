version: "1.0.0"
description: "GuardMesh Enterprise Governance & Provider Overlay Policies"

base:
  pii:
    enabled: true
    patterns:
      - email
      - phone
      - ssn
      - credit_card
    action: redact
  toxicity:
    enabled: true
    threshold: 0.8
  blocked_topics:
    enabled: true
    keywords:
      - malware
      - fraud
    action: block

providers:
  groq:
    toxicity:
      enabled: true
      threshold: 0.4
    blocked_topics:
      enabled: true
      keywords:
        - politics

  gemini:
    pii:
      enabled: true
      action: block
    toxicity:
      enabled: true
      threshold: 0.7
    blocked_topics:
      enabled: true
      keywords:
        - medical

  openai:
    pii:
      enabled: false
      action: redact
    toxicity:
      enabled: true
      threshold: 0.5
    blocked_topics:
      enabled: true
      keywords:
        - weapons
        - drugs
